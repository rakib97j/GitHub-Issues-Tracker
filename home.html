<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Home</title>

    <!-- Favicon -->

    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- Tailwind CSS -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Daisy Ui  -->

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/daisyui.css"
      rel="stylesheet"
      type="text/css"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS Link -->

    <link rel="stylesheet" href="style.css" />

    <!-- Google Font -->

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap");
    </style>

    <!-- Font Awesome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-[#F9FAFB]">
    <!-- navbar -->

    <nav class="bg-white">
      <div class="px-10 mx-auto xl:flex md:flex justify-between py-3">
        <!-- Logo and Name -->

        <div class="flex justify-center items-center gap-2 mb-3 md:mb-0">
          <img class="w-[36px]" src="assets/github-logo.png" alt="#" />

          <h1 class="text-[#1F2937] font-semibold text-2xl">
            GitHub Issues Tracker
          </h1>
        </div>

        <!-- Search -->

        <div class="flex flex-col md:flex-row md:gap-0 gap-3 items-center">
          <div class="relative">
            <input
              id="searchInput"
              class="text-[#64748B] border border-[#E4E4E7] p-2 rounded-lg pl-8 outline-none focus:border-[#4A00FF] focus:ring-1 focus:ring-[#4A00FF]"
              type="text  "
              placeholder="Search issues..."
            />

            <i
              class="text-[#64748B] fa-brands fa-sistrix absolute top-[28px] -translate-y-1/2 left-2"
            ></i>
          </div>

          <button
            id="searchBtn"
            class="btn bg-[#4A00FF] hover:bg-[#4F46E5]/90 text-white p-2 px-3 rounded-lg font-semibold text-base ml-4"
          >
            <i class="fa-solid fa-plus"></i>

            Search
          </button>
        </div>
      </div>
    </nav>

    <!-- Tab Button Section -->

    <div
      class="flex gap-2 p-4 bg-white mt-14 container mx-auto shadow-sm rounded-lg"
    >
      <button
        id="all-btn"
        class="px-3 rounded-lg text-white font-medium text-xs bg-[#4A00FF] py-2.5 w-20 border-[#F1F2F4] border"
      >
        All
      </button>

      <button
        id="open-btn"
        class="px-3 rounded-lg text-[#64748B] font-medium text-xs bg-white py-2.5 border-[#F1F2F4] border"
      >
        Open
      </button>

      <button
        id="closed-btn"
        class="px-3 rounded-lg text-[#64748B] font-medium text-xs bg-white py-2.5 border-[#F1F2F4] border"
      >
        Closed
      </button>
    </div>

    <!-- Card Section -->

    <section
      class="bg-white container mx-auto p-6 rounded-t-lg shadow-lg mt-4 border-b-2 border-[#E4E4E7]"
    >
      <!-- Card count  section  -->

      <div class="flex justify-between">
        <!-- left -->

        <div class="flex items-center">
          <div>
            <img
              src="assets/Aperture.png"
              alt="#"
              class="p-2 bg-[#ECE4FF] rounded-full mr-2"
            />
          </div>

          <div>
            <p class="text-[#1F2937] font-semibold text-xl">
              <span id="total">0</span> Issues
            </p>

            <p class="text-[#64748B] font-normal text-base">
              Track and manage your project issues
            </p>
          </div>
        </div>

        <!-- Right -->

        <div class="md:flex gap-5 items-center hidden">
          <p class="text-[#1F2937] font-normal text-base">
            <i class="fa-solid fa-circle text-[#00A96E]"></i> Open
          </p>

          <p class="text-[#1F2937] font-normal text-base">
            <i class="fa-solid fa-circle text-[#A855F7]"></i> Closed
          </p>
        </div>
      </div>
    </section>

    <!-- Card Sections-->

    <section
      class="bg-[#FBFBFB] container mx-auto p-6 rounded-b-lg shadow-lg mb-16"
    >
      <!-- loading animation -->

      <div
        id="loading"
        class="text-blue-800 flex items-center justify-center gap-4"
      >
        <span class="loading loading-bars loading-xl"></span>

        <span class="loading loading-bars loading-xl"></span>

        <span class="loading loading-bars loading-xl"></span>
      </div>

      <!-- Cards  -->

      <div
        id="cardContainer"
        class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      >
        <!-- cardData  -->
      </div>
    </section>

    <!-- Modal Structure -->
    <div
      id="cardModal"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 hidden"
    >
      <div
        class="bg-white p-6 rounded-lg shadow-xl w-11/12 md:w-1/2 lg:w-1/3 relative"
      >
        <h2 id="modalTitle" class="text-2xl font-bold mb-4 text-[#1F2937]">
          Fix broken image uploads
        </h2>
        <div class="flex items-center space-x-2 mb-4">
          <span
            id="modalStatus"
            class="bg-[#00A96E] text-white text-xs font-medium px-2.5 py-0.5 rounded-full"
            >Opened</span
          >
          <span class="text-sm text-gray-600"
            >• Opened by <span id="modalOpenedBy">Fahim Ahmed</span> •
            <span id="modalDate">22/02/2026</span></span
          >
        </div>
        <div id="modalLabels" class="flex space-x-2 mb-4">
          
        </div>
        <p id="modalDescription" class="text-gray-700 mb-4">
          The navigation menu doesn't collapse properly on mobile devices. Need
          to fix the responsive behavior.
        </p>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <p class="text-sm font-semibold text-gray-600 mb-1">Assignee</p>
            <div class="flex items-center space-x-2">
              <span id="modalAssignee" class="text-sm">John Doe</span>
            </div>
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-600 mb-1">Priority</p>
            <span
              id="modalPriority"
              class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-0.5 rounded-full"
              >HIGH</span
            >
          </div>
        </div>
        <button
          id="closeModal"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <script src="script/home.js"></script>
  </body>
</html>
