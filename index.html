<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css" />

    <!-- Google Font -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap");
    </style>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#F9FAFB] h-svh flex items-center justify-center">
    <div
      class="bg-white flex flex-col items-center justify-center py-7 px-9 shadow-lg rounded-lg"
    >
      <div class="text-center">
        <div class="flex justify-center items-center">
          <img
            src="assets/github-logo.png"
            alt="#"
            class="h-[100px] w-[100px] mb-6"
          />
        </div>
        <h1 class="text-[#1F2937] font-semibold text-2xl mb-1">
          GitHub Issues Tracker
        </h1>
        <p class="text-[#64748B] font-normal text-base pb-6">
          Sign in to manage your issues
        </p>
      </div>
      <div class="">
        <!-- Form U-P -->
        <form class="w-full">
          <label class="text-[#1F2937] text-base font-normal" for="Username"
            >Username</label
          >
          <br />
          <input
            class="border border-[#E4E4E7] py-3 px-8 rounded-lg bg-[#E4E4E7]   outline-none focus:border-[#4A00FF] focus:ring-1 focus:ring-[#4A00FF]"
            type="text"
            name="username"
            id="username"
            placeholder="Enter Username"
          />
          <br />
          <p class="text-[#4A00FF] font-normal text-sm mt-2 mb-3">
            Default: admin
          </p>
          <label class="text-[#1F2937] text-base font-normal" for="Username"
            >Password</label
          >
          <br />
          <input
            class="border border-[#E4E4E7] py-3 px-8 rounded-lg bg-[#E4E4E7]  outline-none focus:border-[#4A00FF] focus:ring-1 focus:ring-[#4A00FF]"
            type="password"
            name="password"
            id="password"
            placeholder="Enter Password"
          />
          <br />
          <p class="text-[#4A00FF] font-normal text-sm mt-2">
            Default: admin123
          </p>
          <button
            type="submit"
            class="w-full bg-[#4A00FF] hover:bg-[#4800ffc7] text-white py-2 rounded-lg my-4"
            id="signinBtn"
          >
            Sign In
          </button>
        </form>
      </div>


      <div class=""> 
        <h1 class="pt-6 text-center pb-1 text-[#64748B] font-normal text-sm">Demo Credentials:</h1>
        <div class="bg-[#F8FAFC] px-16 py-6 text-center rounded-lg text-[#1F2937] font-normal text-base">
          <p><span class="font-semibold">Username:</span> admin</p>
          <p><span class="font-semibold">Password:</span> admin123</p>
        </div>
      </div>
      
    </div>



    <script src="script/signin.js"></script>
  </body>
</html>
